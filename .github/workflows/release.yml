name: Release Executa binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match tool version, e.g. v1.0.1)'
        required: true
        default: v1.0.1
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x86_64
          - runner: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python -c "import json,os; assert os.environ['RELEASE_TAG']=='v'+json.load(open('executas/mini-notes/manifest.json'))['version']"
      - name: Build archive for native runner
        run: python scripts/package_binary.py --platform ${{ matrix.platform }}
      - name: Smoke test archived executable (describe and reverse sampling)
        shell: bash
        run: |
          suffix=""
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then suffix=".exe"; fi
          python scripts/test_archive.py --platform '${{ matrix.platform }}'
          python scripts/test_protocol.py --binary "dist/${{ matrix.platform }}/bin/mini-notes${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: executa-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: executa-*
          merge-multiple: true
          path: release
      - name: Upload all three platforms to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          test "$(find release -name '*.tar.gz' -o -name '*.zip' | wc -l)" -eq 3
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "Mini Notes $RELEASE_TAG" --notes "Native Anna Executa binaries for macOS Apple Silicon, macOS Intel, and Windows x64."
          gh release upload "$RELEASE_TAG" release/* --clobber
